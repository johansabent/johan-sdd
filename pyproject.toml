[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "johan-sdd"
version = "0.1.0"
description = "Portable orchestration contracts for spec-driven delivery"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { file = "LICENSE" }
authors = [
  { name = "Johan Pigari Costa" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/johansabent/johan-sdd"
Repository = "https://github.com/johansabent/johan-sdd"

[project.scripts]
johan-sdd = "johan_sdd.__main__:main"

[dependency-groups]
dev = [
  "jsonschema>=4.23,<5",
  "pytest>=8.3,<9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/johan_sdd"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
